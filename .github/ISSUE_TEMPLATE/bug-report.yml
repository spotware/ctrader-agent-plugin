name: Bug Report
description: Report a bug or unexpected behavior of the cTrader plugin
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us investigate.

        This form is for the plugin: its skill and its manifests. For the cTrader platform or your cTrader account, see the [cTrader Help Centre](https://help.ctrader.com/).

        **Before submitting, please note:** A clear description and reproduction steps are the most helpful things you can provide. If you have done genuine investigation and have a non-obvious insight into the root cause, include it. But please do not speculate or include LLM-generated diagnoses: an incorrect analysis is harder to work with than none at all. Never paste passwords, access tokens or account details into an issue.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Pre-submission Checks
      options:
        - label: I am using the latest version of the plugin
          required: true
        - label: I searched existing issues and found no duplicates
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: >-
        Describe the bug clearly. Include what happened and what you expected to happen instead.
      placeholder: |
        What happened:
        ...

        What I expected:
        ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: >-
        Provide the minimal steps needed to reproduce this bug. Include the exact prompt or install command used if applicable.
      placeholder: |
        1. Install the plugin via ...
        2. Ask the agent to ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: affected-skill
    attributes:
      label: Affected Skill
      description: Which skill exhibits the bug?
      multiple: true
      options:
        - ctrader-analytics
        - Not a skill (manifest or installation)
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: ai-agent
    attributes:
      label: AI Agent
      description: Which agent were you using?
      multiple: true
      options:
        - Claude Code
        - Grok Build
        - Gemini CLI
        - GitHub Copilot CLI
        - Kiro
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Plugin Installation Method
      options:
        - claude plugin install (Claude Code marketplace)
        - gemini extensions install
        - copilot plugin install
        - Kiro Powers panel (Import power from a repository URL)
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: >-
        Paste any error messages or relevant log output. This will be automatically formatted as a code block.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: >-
        Add any other context about the problem here. Screenshots or environment details may be helpful.
